name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches: [ main ]
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.10"
            os: ubuntu-latest
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
          - python-version: "3.14"
            os: ubuntu-latest

    name: python${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The tests compile and simulate what they generate. Without these two they skip that part.
      - name: Install Verilator and Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends verilator iverilog

      - name: Install
        run: python -m pip install ".[dev]"

      - name: Test
        run: pytest

#-------------------------------------------------------------------------------
  # Two SoCs the exporter did not grow up with, generated and checked against their own RTL (D24, D50):
  # tests/test_real_designs.py. The commits are the ones its numbers were taken at; move them together.
  real_designs:
    name: Croc and Didactic SoC
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: pulp-platform/croc
          ref: 71abd392bec14930292007cfb3a2cda2901bceeb
          path: external/croc

      - uses: actions/checkout@v4
        with:
          repository: Edu4Chip/Didactic-SoC
          ref: d67a723cd1af3d47df130e055c0b73770ab119d0
          path: external/Didactic-SoC

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install ".[dev]"

      - name: Test
        run: pytest -v tests/test_real_designs.py
        env:
          CROC_DIR: external/croc
          DIDACTIC_DIR: external/Didactic-SoC

#-------------------------------------------------------------------------------
  build:
    needs:
      - test
      - real_designs
    name: Build sdist and wheel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tool
        run: python -m pip install build

      - name: Build
        run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

#-------------------------------------------------------------------------------
  # Manual publish to TestPyPI for pre-release testing.
  # Trigger via  `gh workflow run build.yml`
  publish_testpypi:
    needs:
      - build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

#-------------------------------------------------------------------------------
  # Publish to PyPI whenever a GitHub Release is published.
  publish_pypi:
    needs:
      - build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
